name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python3 scripts/lint.py
      - run: bash -n install.sh scripts/test-install.sh
      - run: shellcheck install.sh scripts/test-install.sh
      - name: Validate Claude manifests with the official CLI
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.300
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
  install:
    runs-on: ubuntu-latest
    container: debian:bookworm-slim
    steps:
      - name: Install test tools
        run: apt-get update && apt-get install -y --no-install-recommends bash git curl ca-certificates diffutils
      - uses: actions/checkout@v4
      - name: Test install lifecycle in a clean container and HOME
        run: D_STACK_TEST_REMOTE=1 bash scripts/test-install.sh
